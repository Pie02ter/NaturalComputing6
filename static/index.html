<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evacuation Simulator</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="layout">
    <section class="panel controls">
      <h1>Evacuation Simulator</h1>
      <p class="muted">Simple local browser UI for testing layouts and movement parameters.</p>

      <div class="grid two-columns">
        <label>
          Layout
          <select id="layout"></select>
        </label>
        <label>
          Seed
          <input id="seed" type="number" min="0" step="1">
        </label>
        <label>
          High mobility
          <input id="num-high" type="number" min="0" step="1">
        </label>
        <label>
          Low mobility
          <input id="num-low" type="number" min="0" step="1">
        </label>
        <label>
          Max ticks
          <input id="max-ticks" type="number" min="1" step="1">
        </label>
        <label>
          Dt
          <input id="dt" type="number" min="0.01" step="0.01">
        </label>
      </div>

      <div id="params" class="params"></div>

      <div class="actions">
        <button id="run-button">Run simulation</button>
        <button id="replay-button" type="button">Replay</button>
      </div>

      <p id="status" class="status">Loading configuration...</p>
    </section>

    <section class="panel viewer">
      <canvas id="sim-canvas" width="720" height="480"></canvas>
      <div class="metrics">
        <div><strong>Ticks:</strong> <span id="metric-ticks">-</span></div>
        <div><strong>Total time:</strong> <span id="metric-time">-</span></div>
        <div><strong>Evacuated:</strong> <span id="metric-evacuated">-</span></div>
        <div><strong>Remaining:</strong> <span id="metric-remaining">-</span></div>
        <div><strong>Near collisions:</strong> <span id="metric-collisions">-</span></div>
        <div><strong>Mean congestion:</strong> <span id="metric-congestion">-</span></div>
        <div><strong>High group time:</strong> <span id="metric-high">-</span></div>
        <div><strong>Low group time:</strong> <span id="metric-low">-</span></div>
        <div><strong>Fairness gap:</strong> <span id="metric-gap">-</span></div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
