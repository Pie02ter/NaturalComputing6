[project]
name = "crowd-evac"
version = "0.1.0"
description = "Heterogeneous crowd evacuation experiments with baselines and a genetic algorithm."
requires-python = ">=3.10"
dependencies = ["matplotlib", "numpy", "pandas", "pillow"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
